name: CI

# The gate is defined once, in the Makefile. CI runs the same targets a
# developer runs locally, so "green here, red there" cannot happen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so an advisory published against a locked dependency turns main red
  # even when nobody pushes. The lockfile is what actually ships.
  schedule:
    - cron: "23 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from pyproject's requires-python, and the version the
        # Dockerfile actually ships. Both have to stay green.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -c requirements-dev.lock -e ".[dev]"

      - name: Lockfiles match pyproject.toml
        # Re-resolving keeps every existing pin, so this fails only when a
        # dependency changed in pyproject.toml without `make lock`.
        if: matrix.python-version == '3.12'
        run: pip install uv==0.12.3 && make lock-check

      - name: Known vulnerabilities in locked dependencies
        if: matrix.python-version == '3.12'
        run: >-
          pip install pip-audit==2.10.1 &&
          pip-audit -r requirements.lock -r requirements-dev.lock
          --disable-pip --no-deps --progress-spinner off

      - name: Lint (ruff check + format check)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Test
        run: make test

      - name: Offline evaluation smoke test
        # Exercises the real graph end to end with fake providers: no network,
        # no keys, no cost. Guards the failure mode where the harness reports a
        # clean run while producing zero claims.
        run: make eval-fake

  container:
    # The unit tests run on SQLite inside the test process. This job runs what
    # a deployer runs: the image on its own defaults, and the compose stack on
    # Postgres in production mode, each driven through the real HTTP API.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image starts on its own defaults and completes a run
        run: |
          docker build -t groundwork:ci .
          docker run -d --name groundwork -p 8001:8000 groundwork:ci
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null localhost:8001/health
          python3 scripts/smoke_test.py http://localhost:8001

      - name: Compose stack runs in production mode on Postgres
        env:
          POSTGRES_PASSWORD: ci-only-password
          ENVIRONMENT: production
          API_KEY: ci-only-api-key
          CORS_ORIGINS: '["https://groundwork.example"]'
        run: |
          docker compose up -d --build
          curl -sf --retry 30 --retry-all-errors --retry-delay 1 -o /dev/null localhost:8000/health
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/research)" = "401"
          python3 scripts/smoke_test.py http://localhost:8000 --api-key ci-only-api-key

      - name: Container logs
        if: failure()
        run: |
          docker logs groundwork || true
          docker compose logs --no-color || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f groundwork || true
          docker compose down -v || true
