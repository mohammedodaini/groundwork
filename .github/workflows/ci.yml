name: CI

# The gate is defined once, in the Makefile. CI runs the same targets a
# developer runs locally, so "green here, red there" cannot happen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor from pyproject's requires-python, and the version the
        # Dockerfile actually ships. Both have to stay green.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff check + format check)
        run: make lint

      - name: Typecheck (mypy)
        run: make typecheck

      - name: Test
        run: make test

      - name: Offline evaluation smoke test
        # Exercises the real graph end to end with fake providers: no network,
        # no keys, no cost. Guards the failure mode where the harness reports a
        # clean run while producing zero claims.
        run: make eval-fake
