services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groundwork
      POSTGRES_PASSWORD: groundwork
      POSTGRES_DB: groundwork
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app must not start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwork:groundwork@db:5432/groundwork
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LOG_JSON: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
