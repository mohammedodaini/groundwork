services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: groundwork
      # Required, never defaulted: a password checked into the repository is a
      # password everyone has. Set it in .env (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; see .env.example}
      POSTGRES_DB: groundwork
    # No `ports:` on purpose. The api reaches Postgres over the compose network
    # as db:5432. Publishing the port would expose the database on the host's
    # network interfaces, and Docker's published ports bypass host firewalls
    # such as ufw. To inspect it: docker compose exec db psql -U groundwork
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app must not start before Postgres accepts connections.
      test: ["CMD-SHELL", "pg_isready -U groundwork -d groundwork"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://groundwork:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env; see .env.example}@db:5432/groundwork
      # ENVIRONMENT=production refuses to start without API_KEY. Both are passed
      # through: a key set in .env must reach the container, or the API it
      # protects runs open.
      ENVIRONMENT: ${ENVIRONMENT:-local}
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Trust X-Forwarded-For only from your reverse proxy, so the rate limiter
      # sees real client addresses. The default trusts nobody but localhost.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      LOG_JSON: "true"
    ports:
      - "8000:8000"

volumes:
  pgdata:
